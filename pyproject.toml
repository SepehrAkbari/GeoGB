[build-system]
requires = [
  "setuptools==75.8.2",
  "wheel==0.45.1",
  "Cython==0.29.37",
]
build-backend = "setuptools.build_meta"

[project]
name = "deepgroebner"
version = "0.0.1"
description = "Reinforcement-learning selection strategies for Groebner basis computation"
readme = "README.md"
requires-python = "==3.10.*"
authors = [{ name = "Dylan Peifer", email = "djp282@cornell.edu" }]
dependencies = [
  "box2d-py==2.3.5",
  "gym==0.23.1",
  "ipython==8.12.3",
  "matplotlib==3.7.5",
  "numpy==1.24.3",
  "pandas==2.0.3",
  "pygame==2.5.2",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "seaborn==0.13.2",
  "sympy==1.12",
  "tensorflow==2.13.1",
  "tensorflow-macos==2.13.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.1.2",
  "typing-extensions==4.5.0",
]

[project.urls]
Repository = "https://github.com/dylanpeifer/deepgroebner"

[dependency-groups]
dev = [
  "ipykernel==6.29.5",
  "pyinstrument==4.7.3",
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["deepgroebner*", "geogb*"]

[tool.uv]
preview = true
required-version = ">=0.8.4"

[tool.uv.extra-build-dependencies]
box2d-py = ["swig==4.1.1"]
